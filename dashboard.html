<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwoom Note Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #FAF6F0; }
        /* 부드러운 뉴모피즘 스타일 그림자 효과 */
        .neumorphic {
            background: #FAF6F0;
            box-shadow: 6px 6px 12px #e5e1dc, -6px -6px 12px #ffffff;
            border-radius: 20px;
        }
        .neumorphic-inset {
            background: #FAF6F0;
            box-shadow: inset 4px 4px 8px #e5e1dc, inset -4px -4px 8px #ffffff;
            border-radius: 15px;
        }
        .neumorphic-btn {
            background: #FAF6F0;
            box-shadow: 4px 4px 8px #e5e1dc, -4px -4px 8px #ffffff;
            transition: all 0.2s ease;
        }
        .neumorphic-btn:hover {
            box-shadow: 2px 2px 4px #e5e1dc, -2px -2px 4px #ffffff;
            transform: translateY(1px);
        }
    </style>
</head>
<body class="p-4 md:p-8 text-stone-700">

    <div class="max-w-7xl mx-auto">
        <header class="flex items-center justify-between mb-8 p-4">
            <div class="flex items-center gap-3">
                <span class="w-4 h-4 bg-teal-300 rounded-full inline-block"></span>
                <h1 class="text-2xl font-bold tracking-tight">금리 · 유가 · 환율 <span class="text-xs text-stone-400 font-normal">FRED</span></h1>
            </div>
            <div class="text-xs text-stone-400" id="sync-time">동기화 대기 중...</div>
        </header>

        <main class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8" id="macro-container">
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div>
                    <span class="w-3 h-3 bg-teal-200 rounded-full inline-block mb-2"></span>
                    <p class="text-xs text-stone-400 font-medium">미국채 30년물</p>
                </div>
                <div>
                    <p class="text-2xl font-bold" id="US30Y-price">-</p>
                    <p class="text-xs font-semibold" id="US30Y-change">-</p>
                </div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div>
                    <span class="w-3 h-3 bg-orange-200 rounded-full inline-block mb-2"></span>
                    <p class="text-xs text-stone-400 font-medium">미국채 10년물</p>
                </div>
                <div>
                    <p class="text-2xl font-bold" id="US10Y-price">-</p>
                    <p class="text-xs font-semibold" id="US10Y-change">-</p>
                </div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div>
                    <span class="w-3 h-3 bg-purple-200 rounded-full inline-block mb-2"></span>
                    <p class="text-xs text-stone-400 font-medium">미국채 2년물</p>
                </div>
                <div>
                    <p class="text-2xl font-bold" id="US2Y-price">-</p>
                    <p class="text-xs font-semibold" id="US2Y-change">-</p>
                </div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div>
                    <span class="w-3 h-3 bg-yellow-200 rounded-full inline-block mb-2"></span>
                    <p class="text-xs text-stone-400 font-medium">연준 기준금리</p>
                </div>
                <div>
                    <p class="text-2xl font-bold" id="FED_RATE-price">5.25%</p>
                    <p class="text-xs text-stone-400" id="FED_RATE-change">0.0bp</p>
                </div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div>
                    <span class="w-3 h-3 bg-blue-200 rounded-full inline-block mb-2"></span>
                    <p class="text-xs text-stone-400 font-medium">WTI 유가</p>
                </div>
                <div>
                    <p class="text-2xl font-bold" id="WTI-price">-</p>
                    <p class="text-xs font-semibold" id="WTI-change">-</p>
                </div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div>
                    <span class="w-3 h-3 bg-emerald-200 rounded-full inline-block mb-2"></span>
                    <p class="text-xs text-stone-400 font-medium">브렌트유</p>
                </div>
                <div>
                    <p class="text-2xl font-bold" id="BRENT-price">-</p>
                    <p class="text-xs font-semibold" id="BRENT-change">-</p>
                </div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div>
                    <span class="w-3 h-3 bg-red-200 rounded-full inline-block mb-2"></span>
                    <p class="text-xs text-stone-400 font-medium">원/달러 환율</p>
                </div>
                <div>
                    <p class="text-2xl font-bold" id="USD_KRW-price">-</p>
                    <p class="text-xs font-semibold" id="USD_KRW-change">-</p>
                </div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div>
                    <span class="w-3 h-3 bg-indigo-200 rounded-full inline-block mb-2"></span>
                    <p class="text-xs text-stone-400 font-medium">VIX 지수</p>
                </div>
                <div>
                    <p class="text-2xl font-bold" id="VIX-price">-</p>
                    <p class="text-xs font-semibold" id="VIX-change">-</p>
                </div>
            </div>
        </main>

        <div class="w-full bg-gradient-to-r from-rose-400 to-pink-500 text-white rounded-2xl p-4 mb-8 flex justify-between items-center shadow-md">
            <div>
                <p class="font-bold flex items-center gap-2">⚡ 실시간 뉴스 속보</p>
                <p class="text-xs opacity-90">saveticker · 실시간 주요 마켓 속보 모아보기</p>
            </div>
            <span class="text-xl">➔</span>
        </div>

        <section class="mb-8">
            <div class="flex items-center gap-2 mb-4">
                <span class="w-4 h-4 bg-orange-300 rounded-full inline-block"></span>
                <h2 class="text-lg font-bold">한국 보유종목 공시 뉴스 <span class="text-xs text-stone-400 font-normal">DART RSS</span></h2>
            </div>
            <div class="neumorphic p-6" id="kr-container">
                <p class="text-sm text-stone-400">데이터를 불러오는 중입니다...</p>
            </div>
        </section>

        <section class="mb-8">
            <div class="flex items-center gap-2 mb-4">
                <span class="w-4 h-4 bg-purple-300 rounded-full inline-block"></span>
                <h2 class="text-lg font-bold">미국주 보유종목 뉴스 <span class="text-xs text-stone-400 font-normal">FINNHUB RSS</span></h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="us-container">
                <p class="text-sm text-stone-400 col-span-2">데이터를 불러오는 중입니다...</p>
            </div>
        </section>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            fetch('data.json')
                .then(res => res.json())
                .then(data => {
                    // 동기화 시간 업데이트
                    document.getElementById('sync-time').innerText = `최근 업데이트: ${data.updated_at}`;

                    // 1. 거시 지표 데이터 맵핑
                    const keys = ['US30Y', 'US10Y', 'US2Y', 'WTI', 'BRENT', 'USD_KRW', 'VIX'];
                    keys.forEach(key => {
                        if (data.macro[key]) {
                            const item = data.macro[key];
                            const priceEl = document.getElementById(`${key}-price`);
                            const changeEl = document.getElementById(`${key}-change`);
                            
                            let unit = (key === 'USD_KRW') ? '원' : (['WTI', 'BRENT'].includes(key) ? '$' : '%');
                            priceEl.innerText = key === 'USD_KRW' ? `${item.price.toLocaleString()}${unit}` : (['WTI', 'BRENT'].includes(key) ? `${unit}${item.price}` : `${item.price}${unit}`);
                            
                            if (item.direction === 'up') {
                                changeEl.innerText = `▲ ${item.change}`;
                                changeEl.className = 'text-xs font-semibold text-red-500';
                            } else {
                                changeEl.innerText = `▼ ${Math.abs(item.change)}`;
                                changeEl.className = 'text-xs font-semibold text-blue-500';
                            }
                        }
                    });

                    // 2. 한국 공시 데이터 맵핑
                    const krContainer = document.getElementById('kr-container');
                    krContainer.innerHTML = '';
                    
                    let krHtml = '';
                    for (const [stock, newsList] of Object.entries(data.kr_dart)) {
                        krHtml += `<div class="mb-4 last:mb-0">
                            <h3 class="font-bold text-sm bg-stone-200 text-stone-700 px-3 py-1 rounded-full inline-block mb-2">${stock}</h3>
                            <ul class="list-disc list-inside space-y-1 text-sm text-stone-600 pl-2">`;
                        newsList.forEach(news => {
                            krHtml += `<li><a href="${news.link}" target="_blank" class="hover:underline hover:text-stone-900">${news.title}</a></li>`;
                        });
                        krHtml += `</ul></div>`;
                    }
                    krContainer.innerHTML = krHtml || '<p class="text-sm text-stone-400">오늘 신규 공시 뉴스가 없습니다.</p>';

                    // 3. 미국 뉴스 데이터 맵핑
                    const usContainer = document.getElementById('us-container');
                    usContainer.innerHTML = '';
                    
                    let usHtml = '';
                    for (const [stock, newsList] of Object.entries(data.us_news)) {
                        usHtml += `<div class="neumorphic p-5">
                            <h3 class="font-bold text-sm text-red-500 mb-3 tracking-wider">${stock}</h3>
                            <ul class="space-y-2 text-sm text-stone-600">`;
                        newsList.forEach(news => {
                            usHtml += `<li class="border-b border-stone-100 pb-2 last:border-0 last:pb-0">
                                <a href="${news.link}" target="_blank" class="hover:underline block font-medium text-stone-700 leading-snug hover:text-stone-900">${news.title}</a>
                            </li>`;
                        });
                        usHtml += `</ul></div>`;
                    }
                    usContainer.innerHTML = usHtml || '<p class="text-sm text-stone-400">가져온 뉴스가 없습니다.</p>';
                })
                .catch(err => {
                    console.error("데이터 로드 실패, 기본값으로 채웁니다.", err);
                    document.getElementById('sync-time').innerText = '데이터 파일(data.json) 생성 대시 중...';
                });
        });
    </script>
</body>
</html>
