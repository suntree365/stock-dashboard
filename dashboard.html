<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiwoom Note Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght=300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #FAF6F0; }
        .neumorphic {
            background: #FAF6F0;
            box-shadow: 6px 6px 12px #e5e1dc, -6px -6px 12px #ffffff;
            border-radius: 20px;
        }
        .leader-badge {
            background: linear-gradient(145deg, #ffedea, #ffffff);
            box-shadow: 3px 3px 6px #e5e1dc, -3px -3px 6px #ffffff;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-stone-700">

    <div class="max-w-7xl mx-auto">
        <!-- 헤더 영역 -->
        <header class="flex items-center justify-between mb-8 p-4">
            <div class="flex items-center gap-3">
                <span class="w-4 h-4 bg-teal-300 rounded-full inline-block"></span>
                <h1 class="text-2xl font-bold tracking-tight">금리 · 유가 · 환율 <span class="text-xs text-stone-400 font-normal">FRED</span></h1>
            </div>
            <div class="text-xs text-stone-400" id="sync-time">동기화 대기 중...</div>
        </header>

        <!-- 거시 지표 섹션 -->
        <main class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8">
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div><span class="w-3 h-3 bg-teal-200 rounded-full inline-block mb-2"></span><p class="text-xs text-stone-400 font-medium">미국채 30년물</p></div>
                <div><p class="text-2xl font-bold" id="US30Y-price">-</p><p class="text-xs font-semibold" id="US30Y-change">-</p></div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div><span class="w-3 h-3 bg-orange-200 rounded-full inline-block mb-2"></span><p class="text-xs text-stone-400 font-medium">미국채 10년물</p></div>
                <div><p class="text-2xl font-bold" id="US10Y-price">-</p><p class="text-xs font-semibold" id="US10Y-change">-</p></div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div><span class="w-3 h-3 bg-purple-200 rounded-full inline-block mb-2"></span><p class="text-xs text-stone-400 font-medium">미국채 2년물</p></div>
                <div><p class="text-2xl font-bold" id="US2Y-price">-</p><p class="text-xs font-semibold" id="US2Y-change">-</p></div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div><span class="w-3 h-3 bg-yellow-200 rounded-full inline-block mb-2"></span><p class="text-xs text-stone-400 font-medium">연준 기준금리</p></div>
                <div><p class="text-2xl font-bold" id="FED_RATE-price">5.25%</p><p class="text-xs text-stone-400">0.0bp</p></div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div><span class="w-3 h-3 bg-blue-200 rounded-full inline-block mb-2"></span><p class="text-xs text-stone-400 font-medium">WTI 유가</p></div>
                <div><p class="text-2xl font-bold" id="WTI-price">-</p><p class="text-xs font-semibold" id="WTI-change">-</p></div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div><span class="w-3 h-3 bg-emerald-200 rounded-full inline-block mb-2"></span><p class="text-xs text-stone-400 font-medium">브렌트유</p></div>
                <div><p class="text-2xl font-bold" id="BRENT-price">-</p><p class="text-xs font-semibold" id="BRENT-change">-</p></div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div><span class="w-3 h-3 bg-red-200 rounded-full inline-block mb-2"></span><p class="text-xs text-stone-400 font-medium">원/달러 환율</p></div>
                <div><p class="text-2xl font-bold" id="USD_KRW-price">-</p><p class="text-xs font-semibold" id="USD_KRW-change">-</p></div>
            </div>
            <div class="neumorphic p-5 flex flex-col justify-between h-36">
                <div><span class="w-3 h-3 bg-indigo-200 rounded-full inline-block mb-2"></span><p class="text-xs text-stone-400 font-medium">VIX 지수</p></div>
                <div><p class="text-2xl font-bold" id="VIX-price">-</p><p class="text-xs font-semibold" id="VIX-change">-</p></div>
            </div>
        </main>

        <!-- 🔥 신규 추가: 당일 주도주 조건 검색 결과 섹션 -->
        <section class="mb-8">
            <div class="flex items-center gap-2 mb-4">
                <span class="w-4 h-4 bg-rose-500 rounded-full inline-block animate-pulse"></span>
                <h2 class="text-lg font-bold text-rose-600">시장 주도주 실시간 포착 <span class="text-xs text-stone-400 font-normal ml-1">(거래대금 2000억 ↑ & 상승률 15% ↑)</span></h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4" id="leaders-container">
                <!-- 자바스크립트가 실시간 동적 카드 생성 생성 단추 -->
            </div>
        </section>

        <!-- 한국 보유종목 공시성 뉴스 섹션 -->
        <section class="mb-8">
            <div class="flex items-center gap-2 mb-4">
                <span class="w-4 h-4 bg-orange-300 rounded-full inline-block"></span>
                <h2 class="text-lg font-bold">한국 보유종목 공시 뉴스 <span class="text-xs text-stone-400 font-normal">DART RSS</span></h2>
            </div>
            <div class="neumorphic p-6" id="kr-container">
                <p class="text-sm text-stone-400">데이터를 불러오는 중입니다...</p>
            </div>
        </section>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const dataUrl = 'https://raw.githubusercontent.com/suntree365/stock-dashboard/main/data.json';
            
            fetch(dataUrl)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('sync-time').innerText = `최근 업데이트: ${data.updated_at}`;

                    // 거시 지표 맵핑
                    const keys = ['US30Y', 'US10Y', 'US2Y', 'WTI', 'BRENT', 'USD_KRW', 'VIX'];
                    keys.forEach(key => {
                        if (data.macro[key]) {
                            const item = data.macro[key];
                            const priceEl = document.getElementById(`${key}-price`);
                            const changeEl = document.getElementById(`${key}-change`);
                            if (!priceEl || !changeEl) return;

                            let unit = (key === 'USD_KRW') ? '원' : (['WTI', 'BRENT'].includes(key) ? '$' : '%');
                            priceEl.innerText = key === 'USD_KRW' ? `${item.price.toLocaleString()}${unit}` : (['WTI', 'BRENT'].includes(key) ? `${unit}${item.price}` : `${item.price}${unit}`);
                            
                            if (item.direction === 'up') {
                                changeEl.innerText = `▲ ${item.change}`;
                                changeEl.className = 'text-xs font-semibold text-red-500';
                            } else {
                                changeEl.innerText = `▼ ${Math.abs(item.change)}`;
                                changeEl.className = 'text-xs font-semibold text-blue-500';
                            }
                        }
                    });

                    // 1. 시장 주도주 동적 바인딩 (수정 영역)
                    const leadersContainer = document.getElementById('leaders-container');
                    leadersContainer.innerHTML = '';
                    if (data.market_leaders && data.market_leaders.length > 0) {
                        data.market_leaders.forEach(stock => {
                            leadersContainer.innerHTML += `
                                <div class="leader-badge p-4 rounded-2xl border border-rose-100 flex justify-between items-center">
                                    <div>
                                        <p class="font-bold text-stone-800 text-sm">${stock.name}</p>
                                        <p class="text-xs text-stone-400">대금: ${stock.amount}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-sm font-bold text-red-500 bg-red-50 px-2 py-1 rounded-md inline-block">+${stock.ratio}%</span>
                                    </div>
                                </div>`;
                        });
                    } else {
                        leadersContainer.innerHTML = '<p class="text-sm text-stone-400 col-span-4">현재 조건에 일치하는 주도주가 없습니다.</p>';
                    }

                    // 2. 한국 DART 공시 바인딩
                    const krContainer = document.getElementById('kr-container');
                    let krHtml = '';
                    for (const [stock, newsList] of Object.entries(data.kr_dart)) {
                        krHtml += `<div class="mb-4 last:mb-0"><h3 class="font-bold text-sm bg-stone-200 text-stone-700 px-3 py-1 rounded-full inline-block mb-2">${stock}</h3><ul class="list-disc list-inside space-y-1 text-sm text-stone-600 pl-2">';`;
                        newsList.forEach(news => { 
                            krHtml += `<li><a href="${news.link}" target="_blank" class="hover:underline hover:text-stone-900">${news.title}</a></li>`; 
                        });
                        krHtml += `</ul></div>`;
                    }
                    krContainer.innerHTML = krHtml || '<p class="text-sm text-stone-400">오늘 신규 공시 뉴스가 없습니다.</p>';
                })
                .catch(err => console.error("데이터 로드 에러", err));
        });
    </script>
</body>
</html>
