name: Auto Asset Data Update

on:
  schedule:
    - cron: '0 * * * *' # 장중 실시간 포착률을 높이기 위해 매시 정각(1시간 주기)으로 단축
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 파일 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 가상 컴퓨터 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 금융 라이브러리 설치
      run: |
        pip install yfinance

    - name: 수집 및 조건 검색 스크립트 실행
      run: python update_data.py

    - name: data.json 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git commit -m "Automated Market Leader & DART Sync" || exit 0
        git push
