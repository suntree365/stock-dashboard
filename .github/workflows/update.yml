name: Auto Asset Data Update

on:
  schedule:
    - cron: '0 */2 * * *' # 2시간마다 전 세계 금융 데이터를 백그라운드에서 자동으로 긁어옵니다.
  workflow_dispatch: # 사용자가 깃허브에서 'Run workflow' 버튼을 누르면 즉시 수동 수집도 가능하게 합니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 파일 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 가상 컴퓨터 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필수 금융 라이브러리 설치
      run: |
        pip install yfinance

    - name: 수집 스크립트 엔진 실행
      run: python update_data.py

    - name: 수집된 신규 데이터를 data.json에 커밋 및 자동 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git commit -m "Automated Financial Data Sync" || exit 0
        git push
